services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: got-it-api
    env_file:
      - .env.docker
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: got-it-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gotit
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d gotit"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-test:
    image: postgres:16-alpine
    container_name: got-it-postgres-test
    profiles: ["test"]
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: gotit_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d gotit_test"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pg_data:
